name: Bug report
description: Something in Stave does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a project…
        2. Run a ticket with Codex…
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Stave version and macOS version
  - type: textarea
    id: logs
    attributes:
      label: Run output or logs
      render: text
