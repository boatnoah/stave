version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
      include: scope
    groups:
      # Toolchain upgrades break builds in their own ways; review them alone.
      electron:
        patterns: ["electron", "@electron/*", "@electron-forge/*"]
      typescript:
        patterns: ["typescript", "@types/*"]
      test-tooling:
        patterns: ["vitest", "@vitest/*", "@playwright/test", "knip", "@biomejs/biome", "lefthook"]
      runtime:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
